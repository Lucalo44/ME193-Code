name: Ground Control
icon: 🕺
description: "Voice/MQTT-commanded dancing robots. A local LLM on the UNO Q plans, deterministic code performs, and the dashboard shows the model thinking."
ports: []
bricks:
  - arduino:web_ui: {}
  - arduino:llm:
      model: llamacpp:Qwen3.5-0.8B-Q4_0
      variables:
        # Default is 16384. Our prompts are ~950 tokens; 4096 keeps the KV cache small
        # (~460 MB for Qwen3-1.7B) so a standard-attention model fits the runner's 2.44 GiB
        # cap, with headroom. 16384 made Qwen3-1.7B thrash at 0.3 tok/s.
        LLAMA_ARG_CTX_SIZE: "4096"
