name: Ground Control
icon: 🕺
description: "Voice/MQTT-commanded dancing robots. A local LLM on the UNO Q plans, deterministic code performs, and the dashboard shows the model thinking."
ports: []
bricks:
  - arduino:web_ui: {}
  - arduino:llm:
      # The fine-tuned planner (tools/finetune/): installed by `tools/deploy.py --model`
      # into models/llamacpp/custom/ and registered in the runner's models.ini.
      model: llamacpp:custom/gc-planner-v2-Q4_0
      variables:
        # Default is 16384. Our prompts are ~1350 tokens; 2048 keeps the KV cache small
        # (~235 MB for Qwen3-1.7B) so a standard-attention model fits the runner's 2.44 GiB
        # cap. 16384 thrashed at 0.3 tok/s; 4096 slowly filled the cap once composer prompts were cached.
        LLAMA_ARG_CTX_SIZE: "2048"
        # Saved prompt caches (docs/SPIKES.md, A1): the planner saves the fixed prefix's KV
        # once and restores it at boot in seconds instead of re-reading 867 tokens for 3 min.
        # /models is the host's models/llamacpp folder, so the files survive restarts.
        LLAMA_ARG_SLOT_SAVE_PATH: "/models/slots"
        # LLAMA_ARG_THREADS stays at App Lab's 4: 3 threads (leaving a core for perception)
        # decoded 24% slower with nothing else running (docs/SPIKES.md, Part 2 A0).
