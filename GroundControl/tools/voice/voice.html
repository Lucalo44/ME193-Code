<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ground Control Voice</title>
<style>
  :root { --bg: #0a0e16; --panel: #111827; --line: #24314a; --text: #e8eef9; --muted: #8693ab; --accent: #5fd4ff; --warn: #ffb020; --ok: #3ddc97; --bad: #ff5c7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 system-ui, sans-serif; padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: .12em; }
  #talk { width: 100%; padding: 34px 0; font-size: 24px; font-weight: 800; border-radius: 16px; border: 2px solid var(--accent);
          background: #10233a; color: var(--text); cursor: pointer; user-select: none; touch-action: none; }
  #talk.on { background: var(--warn); color: var(--bg); border-color: var(--warn); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  #transcript { font-size: 22px; font-weight: 600; min-height: 32px; }
  .muted { color: var(--muted); }
  #log div { font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 2px 0; border-bottom: 1px solid #1a2336; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  input { width: 100%; font: inherit; padding: 8px; background: #162033; color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<h1>◉ GROUND CONTROL · VOICE</h1>
<p class="muted"><span id="mq" class="dot"></span><span id="mqtext">connecting to ws://test.mosquitto.org:8080…</span></p>
<button id="talk">Hold to talk</button>
<div class="card"><div class="muted">You said</div><div id="transcript">–</div></div>
<div class="card"><input id="typed" placeholder="or type a command and press Enter"></div>
<div class="card"><div class="muted">Replies (ME193/q/luca/reply and luca)</div><div id="log"></div></div>
<script>
// ---- minimal MQTT 3.1.1 over WebSocket: CONNECT, SUBSCRIBE, PUBLISH (QoS 0), PINGREQ ----
const TOPIC_CMD = "ME193/q/luca/cmd", SUBS = ["ME193/q/luca/reply", "luca"];
const enc = new TextEncoder(), dec = new TextDecoder();
const str = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
const remLen = (n) => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; o.push(d); } while (n); return o; };
const pkt = (type, body) => new Uint8Array([type, ...remLen(body.length), ...body]);
let ws, pid = 1;
function connect() {
  ws = new WebSocket("ws://test.mosquitto.org:8080/mqtt", "mqtt");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    const id = "gc-voice-" + Math.random().toString(16).slice(2, 8);
    ws.send(pkt(0x10, [...str("MQTT"), 4, 0x02, 0, 30, ...str(id)]));      // clean session, keepalive 30 s
  };
  ws.onmessage = (e) => {
    const b = new Uint8Array(e.data), type = b[0] >> 4;
    let i = 1, mult = 1, len = 0, d;
    do { d = b[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
    if (type === 2) {                                                     // CONNACK
      setStatus(true);
      SUBS.forEach((t) => { const id = pid++; ws.send(pkt(0x82, [id >> 8, id & 255, ...str(t), 0])); });
    } else if (type === 3) {                                              // PUBLISH
      const tl = (b[i] << 8) | b[i + 1], topic = dec.decode(b.slice(i + 2, i + 2 + tl));
      const qos = (b[0] >> 1) & 3, start = i + 2 + tl + (qos ? 2 : 0);
      log(`${topic}: ${dec.decode(b.slice(start, 1 + (i - 1) + len))}`);
    }
  };
  ws.onclose = () => { setStatus(false); setTimeout(connect, 2000); };
}
setInterval(() => ws && ws.readyState === 1 && ws.send(new Uint8Array([0xc0, 0])), 20000);
function publish(topic, text) { ws.send(pkt(0x30, [...str(topic), ...enc.encode(text)])); }
function setStatus(on) { document.getElementById("mq").className = "dot" + (on ? " on" : ""); document.getElementById("mqtext").textContent = on ? "connected to the broker" : "reconnecting…"; }
function log(s) { const d = document.createElement("div"); d.textContent = `${new Date().toLocaleTimeString()}  ${s}`; document.getElementById("log").prepend(d); }
function sendCommand(text) {
  publish(TOPIC_CMD, JSON.stringify({ text, source: "voice" }));
  log(`→ ${TOPIC_CMD}: ${text}`);
}
connect();

// ---- speech (Web Speech API; needs a secure context: localhost or https) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const btn = document.getElementById("talk"), tr = document.getElementById("transcript");
let rec = null, final = "";
if (!SR) { btn.textContent = "Speech recognition not available in this browser (use Chrome)"; btn.disabled = true; }
else {
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
  rec.onresult = (e) => {
    let interim = ""; final = "";
    for (const r of e.results) (r.isFinal ? (final += r[0].transcript) : (interim += r[0].transcript));
    tr.textContent = (final + " " + interim).trim() || "…";
  };
  rec.onend = () => { btn.classList.remove("on"); btn.textContent = "Hold to talk"; const t = final.trim(); if (t) sendCommand(t); final = ""; };
  const start = (e) => { e.preventDefault(); final = ""; tr.textContent = "listening…"; btn.classList.add("on"); btn.textContent = "Listening… release to send"; rec.start(); };
  const stop = (e) => { e.preventDefault(); rec.stop(); };
  btn.addEventListener("pointerdown", start); btn.addEventListener("pointerup", stop); btn.addEventListener("pointerleave", (e) => btn.classList.contains("on") && stop(e));
}
document.getElementById("typed").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.value.trim()) { sendCommand(e.target.value.trim()); e.target.value = ""; } });
</script>
</body>
</html>
