<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14122b">
<title>Campus Navigator</title>
<style>
  :root {
    --night: #14122b; --panel: #1c1a3a; --line: #35326a; --ink: #f6f1ff; --muted: #a29dcc;
    --pink: #ff3d9a; --orange: #ff9a3d; --teal: #2ce5d0; --red: #ff4757;
    --display: "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", Impact, sans-serif;
    --body: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font: 15px/1.3 var(--body);
    overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .disp { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .02em; }

  /* ---- objective strip ---- */
  #objective { position: relative; z-index: 2; display: flex; gap: 12px; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px 20px;
    background: linear-gradient(100deg, #2a2760, #1c1a3a); clip-path: polygon(0 0, 100% 0, 100% 82%, 0 100%);
    margin-bottom: -14px; transition: background .25s; }
  #objective.go { background: linear-gradient(100deg, #b3206c, #ff3d9a 55%, #ff9a3d); }
  #objective.now { background: linear-gradient(100deg, #ff7a1a, #ffb03d); color: #24100a; animation: pulse .7s ease-in-out infinite alternate; }
  #objective.rec { background: linear-gradient(100deg, #8f1d2c, #ff4757); }
  #objective.lost { background: #3a2030; }
  @keyframes pulse { to { filter: brightness(1.18); } }
  #arrow { width: 54px; height: 54px; flex: none; }
  #primary { font-size: 30px; line-height: 1; }
  #secondary { font-size: 14px; opacity: .9; margin-top: 4px; }

  /* ---- map ---- */
  #mapwrap { position: relative; flex: 1; min-height: 180px; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #mapwrap::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 58%, transparent 45%, rgba(10, 8, 28, .75)); }
  .hud { position: absolute; z-index: 1; background: rgba(20, 18, 43, .82); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #north { top: 24px; left: 12px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  #north svg { width: 26px; height: 26px; }
  #view { top: 24px; right: 12px; border-radius: 10px; padding: 9px 12px; font-size: 14px; color: var(--ink); }
  #zoom { top: 74px; right: 12px; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #zoom button { width: 44px; height: 42px; font-size: 22px; background: transparent; border-radius: 0; }
  #zoom button + button { border-top: 1px solid var(--line); }
  #chip { bottom: 10px; left: 12px; border-radius: 8px; padding: 5px 10px; font-size: 14px; }
  #chip b { color: var(--teal); }
  #radio { bottom: 26px; right: 12px; border-radius: 10px; display: flex; align-items: center; max-width: 62%; overflow: hidden; }
  #radio button { background: transparent; border-radius: 0; width: 42px; height: 40px; font-size: 17px; flex: none; }
  #radio button + button { border-left: 1px solid var(--line); }
  #song { padding: 0 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #radio.on #song { color: var(--teal); }
  #osm { position: absolute; z-index: 1; right: 8px; bottom: 6px; font-size: 10px; color: var(--muted); opacity: .8; }
  #toast { position: absolute; z-index: 1; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.9); opacity: 0;
    font-size: 34px; color: var(--teal); text-shadow: 0 2px 14px #000; pointer-events: none; transition: opacity .15s, transform .15s; }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #floor { top: 74px; left: 12px; border-radius: 10px; padding: 7px 10px; font-size: 14px; color: var(--ink); text-align: center; line-height: 1.1; }
  #floor small { display: block; font: 400 10px var(--body); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

  /* ---- bottom sheet ---- */
  #sheet { position: relative; z-index: 2; background: var(--panel); border-top: 2px solid var(--line);
    padding: 12px 14px max(14px, env(safe-area-inset-bottom)); }
  #stats { display: flex; gap: 14px; align-items: flex-end; }
  .stat b { display: block; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  #status { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); max-width: 46%; }
  #bar { display: flex; gap: 3px; margin: 10px 0 12px; }
  #bar i { flex: 1; height: 7px; background: #2b2857; transform: skewX(-18deg); }
  #bar i.on { background: var(--teal); box-shadow: 0 0 8px rgba(44, 229, 208, .6); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { font: inherit; border: 0; border-radius: 10px; color: var(--ink); background: #2b2857; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  #sheet button { flex: 1; padding: 15px 8px; font-size: 20px; }
  #sheet button:active { transform: scale(.97); filter: brightness(1.2); }
  #sheet button small { display: block; font: 400 12px/1.2 var(--body); text-transform: none; letter-spacing: 0; opacity: .8; margin-top: 3px; }
  button.go { background: linear-gradient(100deg, #d42a80, #ff3d9a 60%, #ff9a3d); }
  button.go:disabled { background: #2b2857; color: var(--muted); }
  button.stop { background: var(--red); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  #sheet button.turn { padding: 26px 8px; font-size: 30px; background: #33307a; }
  #sheet button.active { background: var(--orange); color: #24100a; }
  #who { display: flex; background: #131129; border-radius: 10px; padding: 3px; }
  #who button { padding: 9px; font-size: 17px; background: transparent; color: var(--muted); }
  #who button.sel { background: #35326a; color: var(--ink); }
  .label { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin: 2px 0 5px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  #sheet button.link { flex: none; background: none; color: var(--teal); padding: 8px 0 0; font: 14px var(--body); text-transform: none; }

  /* ---- arrived ---- */
  #arrived { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; background: rgba(12, 10, 32, .93); }
  #arrived h2 { margin: 0; font-size: 62px; line-height: .95; background: linear-gradient(100deg, #ff3d9a, #ff9a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #arrived p { margin: 0; color: var(--muted); }
  #arrived button { padding: 15px 44px; font-size: 22px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #objective.now { animation: none; } }
</style>
</head>
<body>
<div id="objective">
  <svg id="arrow" viewBox="0 0 64 64" aria-hidden="true"></svg>
  <div><div id="primary" class="disp">Connecting</div><div id="secondary"></div></div>
</div>

<div id="mapwrap">
  <canvas id="map"></canvas>
  <div id="north" class="hud" aria-label="North"><svg viewBox="0 0 26 26"><path d="M13 2 L18 14 H8 Z" fill="#ff3d9a"/><path d="M13 24 L8 14 H18 Z" fill="#6a66a8"/></svg></div>
  <button id="view" class="hud disp" onclick="toggleView()">Whole map</button>
  <div id="zoom" class="hud"><button onclick="zoomBy(1.5)" aria-label="Zoom in">+</button><button onclick="zoomBy(1 / 1.5)" aria-label="Zoom out">−</button><button onclick="recentre()" aria-label="Recentre the map">⌖</button></div>
  <div id="chip" class="hud"></div>
  <div id="radio" class="hud hidden"><span id="song" class="disp"></span><button id="play" onclick="playPause()" aria-label="Play or pause the music">▶</button><button onclick="nextSong()" aria-label="Skip to another song">⏭</button></div>
  <div id="osm">© OpenStreetMap</div>
  <div id="toast" class="disp"></div>
  <button id="floor" class="hud disp" onclick="nextFloor()" aria-label="Change floor"></button>
</div>

<div id="sheet">
  <div id="stats">
    <div class="stat"><b id="s1" class="disp">0</b><span id="l1">steps</span></div>
    <div class="stat"><b id="s2" class="disp">0 m</b><span id="l2">walked</span></div>
    <div class="stat"><b id="s3" class="disp"></b><span id="l3"></span></div>
    <div id="status"></div>
  </div>
  <div id="bar"></div>

  <div id="idle-ui">
    <div class="label">Who is walking</div>
    <div id="who"></div>
    <div class="row"><button id="nav-btn" class="go disp" onclick="start('navigate')">Navigate<small id="nav-sub"></small></button></div>
    <div class="row">
      <button class="disp" onclick="start('record')">Record demo<small>You walk, you tap the turns</small></button>
      <button class="disp" onclick="start('dagger')">DAgger walk<small>It guides, you correct it</small></button>
    </div>
    <p class="hint" id="saved"></p>
  </div>

  <div id="tap-ui" class="hidden">
    <div class="label" id="tap-label">Tap each one as you do it</div>
    <div class="row"><button class="turn disp" onclick="tap('left')">◀ Left</button><button class="turn disp" onclick="tap('right')">Right ▶</button></div>
    <div class="row">
      <button id="stairs" class="disp" onclick="stairs()">Stairs start</button>
      <button id="wrong" class="disp hidden" onclick="tap('wrong')">Wrong call</button>
      <button class="go disp" onclick="tap('arrive')">Arrived</button>
    </div>
  </div>

  <div class="row hidden" id="stop-ui">
    <button class="stop disp" onclick="stop(false)">Stop and save</button>
    <button class="ghost disp" id="discard" onclick="stop(true)">Discard</button>
  </div>
</div>

<div id="arrived">
  <h2 class="disp">You made it</h2>
  <p id="arrived-sub"></p>
  <button class="go disp" onclick="stop(false)">Done</button>
</div>

<script src="/map.js"></script>
<script src="/interior.js"></script>
<script>
const $ = id => document.getElementById(id);
const RAD = Math.PI / 180;
let S = null, busy = false, person = null, onStairs = false, view = 'follow';

const ARROWS = {
  straight: '<path d="M32 6 L48 26 H37 V58 H27 V26 H16 Z" fill="currentColor"/>',
  left: '<path d="M8 26 L28 10 V20 H44 Q54 20 54 30 V58 H44 V32 Q44 30 42 30 H28 V42 Z" fill="currentColor"/>',
  right: '<path d="M56 26 L36 10 V20 H20 Q10 20 10 30 V58 H20 V32 Q20 30 22 30 H36 V42 Z" fill="currentColor"/>',
  stairs: '<path d="M6 54 H20 V42 H32 V30 H44 V18 H58 V26 H52 V38 H40 V50 H28 V62 H6 Z" fill="currentColor"/>',
  arrive: '<circle cx="32" cy="26" r="16" fill="none" stroke="currentColor" stroke-width="7"/><path d="M32 42 L32 60" stroke="currentColor" stroke-width="7"/>',
  record: '<circle cx="32" cy="32" r="18" fill="currentColor"/>',
  idle: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M32 16 L40 36 L32 31 L24 36 Z" fill="currentColor"/>',
};

// ---------------- board API ----------------
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
function start(mode) { onStairs = false; view = 'follow'; floorPick = null; api('/api/start', {mode, person}).then(render); }
function tap(action, text) {
  if (navigator.vibrate) navigator.vibrate(40);
  toast(text || {left: 'Left', right: 'Right', arrive: 'Arrived', wrong: 'Marked wrong'}[action]);
  api('/api/tap', {action}).then(render);
}
function stairs() { onStairs = !onStairs; tap(onStairs ? 'stairs_start' : 'stairs_end', onStairs ? 'Stairs start' : 'Stairs end'); }
function stop(discard) { if (discard && !confirm('Discard this walk? It will not be saved.')) return; api('/api/stop', {discard}).then(render); }
function toast(text) { const t = $('toast'); t.textContent = text + ' ✓'; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 900); }
function fmtTime(s) { if (s == null) return '—'; const m = Math.floor(s / 60); return m ? `${m} min` : `${Math.round(s)} s`; }

function render(s) {
  S = s;
  const ins = s.instruction, mode = s.mode, goal = s.route.split('->').pop().trim();
  $('objective').className = mode === 'idle' ? '' : mode === 'record' ? 'rec' : ins.now ? 'now' : 'go';
  const icon = mode === 'record' ? 'record' : mode === 'idle' ? 'idle' : (ins.maneuver || 'straight');
  $('arrow').innerHTML = ARROWS[icon] || ARROWS.straight;
  $('primary').textContent = mode === 'idle' ? `To the ${goal}` : mode === 'record' ? 'Recording' : ins.primary;
  $('secondary').textContent = mode === 'idle' ? s.route.replace('->', '→')
    : mode === 'record' ? 'Walk the route and tap each turn' : (ins.secondary || '');

  $('chip').innerHTML = `<b>${s.movement}</b> · heading ${Math.round(s.heading)}°`;
  const f = shownFloor();
  $('floor').innerHTML = `Floor ${f}<small>${floorPick ? 'tap for auto' : 'auto'}</small>`;
  const nav = mode === 'navigate' || mode === 'dagger';
  $('s1').textContent = s.steps; $('l1').textContent = 'steps';
  $('s2').textContent = (nav ? s.remaining_m : s.metres) + ' m'; $('l2').textContent = nav ? 'to go' : 'walked';
  $('s3').textContent = nav ? fmtTime(s.eta_s) : ''; $('l3').textContent = nav ? 'eta' : '';
  $('status').textContent = mode === 'idle' ? (s.model ? 'Route trained and ready' : 'No route trained yet')
    : mode === 'dagger' ? (s.arrived ? 'It thinks you arrived. Keep going and tap Arrived when you really do' : 'DAgger: tap what you really do') : mode === 'record' ? `${s.taps.length ? 'Last tap: ' + s.taps[s.taps.length - 1].action.replace('_', ' ') : 'No taps yet'}` : goal;
  const bar = $('bar');
  if (!bar.children.length) bar.innerHTML = '<i></i>'.repeat(14);
  [...bar.children].forEach((el, i) => el.classList.toggle('on', i < Math.round(14 * (s.progress || 0))));

  const who = $('who');
  if (!who.children.length) {
    try { person = localStorage.getItem('nav-person'); } catch (e) {}
    if (!s.people.includes(person)) person = s.person || s.people[0];
    s.people.forEach(p => { const b = document.createElement('button'); b.className = 'disp'; b.textContent = p;
      b.onclick = () => { person = p; try { localStorage.setItem('nav-person', p); } catch (e) {} sel(); }; who.append(b); });
    const sel = () => [...who.children].forEach(b => b.classList.toggle('sel', b.textContent === person)); sel();
  }
  $('nav-btn').disabled = !s.model;
  $('nav-sub').textContent = s.model ? `Guide me to the ${goal}` : 'Needs a trained route: record demo walks first';
  const tapping = mode === 'record' || mode === 'dagger';
  $('idle-ui').classList.toggle('hidden', mode !== 'idle');
  $('tap-ui').classList.toggle('hidden', !tapping);
  $('wrong').classList.toggle('hidden', mode !== 'dagger');
  $('stairs').textContent = onStairs ? 'Stairs end' : 'Stairs start';
  $('stairs').classList.toggle('active', onStairs);
  $('stop-ui').classList.toggle('hidden', mode === 'idle');
  $('discard').classList.toggle('hidden', mode === 'navigate');
  $('saved').textContent = s.last_saved ? 'Last walk saved: ' + s.last_saved.split('/').slice(-2).join('/') : '';
  // only Navigate ends on the navigator's word; in a DAgger walk you keep walking and tap Arrived yourself
  $('arrived').style.display = s.arrived && mode === 'navigate' ? 'flex' : 'none';
  $('arrived-sub').textContent = `${goal} · ${s.steps} steps · ${s.metres} m`;
  $('view').textContent = view === 'follow' ? 'Whole map' : 'Follow me';
  $('view').classList.toggle('hidden', mode === 'idle');
}

// ---------------- map ----------------
// Outdoors: web/map.js (OpenStreetMap). Indoors: web/interior.js, the two floors traced from the
// building's posted floor plans, with the walked route laid along the corridors. Indoors the board
// can't know where you are on the plan, only how many steps you've taken, so the arrow rides along
// the planned route by step count. The raw dead-reckoned path is on the dashboard.
const M = window.CAMPUS, IN = window.INTERIOR, R = IN ? IN.route : [];
const cam = {x: 0, y: 0, b: 0, z: 1.2}, P = {}, FP = {};
let floorPick = null;                           // null = show the floor you're on
const poly = (path, p, close) => { path.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) path.lineTo(p[i], p[i + 1]); if (close) path.closePath(); };
function build() {
  for (const k of ['green', 'parking', 'block', 'ttc', 'major', 'street', 'service', 'walk', 'steps', 'rail']) P[k] = new Path2D();
  M.green.forEach(p => poly(P.green, p, true)); M.parking.forEach(p => poly(P.parking, p, true));
  M.buildings.forEach(b => poly(b.ttc ? P.ttc : P.block, b.p, true));
  M.roads.forEach(r => poly(P[r.c], r.p)); M.rail.forEach(p => poly(P.rail, p));
  M.labels = M.buildings.filter(b => b.n).map(b => {
    let x = 0, y = 0, x0 = 1e9, x1 = -1e9; const n = b.p.length / 2;
    for (let i = 0; i < b.p.length; i += 2) { x += b.p[i]; y += b.p[i + 1]; x0 = Math.min(x0, b.p[i]); x1 = Math.max(x1, b.p[i]); }
    return {n: b.n.toUpperCase(), x: x / n, y: y / n, w: x1 - x0, ttc: b.ttc};
  });
  const longest = {};
  M.roads.filter(r => r.n).forEach(r => { if (!longest[r.n] || r.p.length > longest[r.n].p.length) longest[r.n] = r; });
  M.streets = Object.values(longest).map(r => { const i = (r.p.length >> 2) * 2; return {n: r.n.toUpperCase(), x: r.p[i], y: r.p[i + 1]}; });
  for (const [f, F] of Object.entries(IN ? IN.floors : {})) {
    FP[f] = {};
    for (const k of ['slab', 'rooms', 'dest', 'cafe', 'stairs']) { FP[f][k] = new Path2D(); (F[k] || []).forEach(p => poly(FP[f][k], p, true)); }
  }
}
// where a step count puts you on the route: position, floor and the compass way the corridor runs
function along(step) {
  if (!R.length) return {x: 0, y: 0, floor: '1', b: 0};
  let i = 0; while (i < R.length - 2 && step > R[i + 1].step) i++;
  const a = R[i], c = R[i + 1], t = Math.min(1, Math.max(0, (step - a.step) / (c.step - a.step)));
  return {x: a.x + (c.x - a.x) * t, y: a.y + (c.y - a.y) * t, floor: t < 0.5 ? a.floor : c.floor,
          b: Math.atan2(c.x - a.x, c.y - a.y) / RAD, i, t};
}
const stepNow = () => S && S.mode !== 'idle' ? S.steps : 0;
const shownFloor = () => floorPick || along(stepNow()).floor;
function nextFloor() { const here = along(stepNow()).floor; floorPick = floorPick ? null : (here === '1' ? '0' : '1'); if (S) render(S); }
function target(w, h) {
  const zf = zoom[viewKey()], me = along(stepNow());
  if (viewKey() === 'follow') return {x: me.x, y: me.y, b: me.b, z: 9 * zf, px: w / 2, py: h * 0.62};
  const xs = [], ys = [];
  M.buildings.filter(b => b.ttc).forEach(b => { for (let i = 0; i < b.p.length; i += 2) { xs.push(b.p[i]); ys.push(b.p[i + 1]); } });
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  return {x: (x0 + x1) / 2 + pan.x, y: (y0 + y1) / 2 + pan.y, b: 0, z: zf * Math.min(w / (x1 - x0 + 60), h / (y1 - y0 + 60)), px: w / 2, py: h / 2};
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const c = $('map'), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w || !M) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const t = target(w, h), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const k = still || !last ? 1 : 1 - Math.exp(-(now - last) / 160); last = now;
  cam.x += (t.x - cam.x) * k; cam.y += (t.y - cam.y) * k; cam.z += (t.z - cam.z) * k;
  cam.b += (((t.b - cam.b) % 360 + 540) % 360 - 180) * k;
  cam.px = t.px; cam.py = t.py;
  const g = c.getContext('2d'), a = -cam.b * RAD;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#14122b'; g.fillRect(0, 0, w, h);
  g.translate(cam.px, cam.py); g.rotate(a); g.scale(cam.z, -cam.z); g.translate(-cam.x, -cam.y);
  g.lineJoin = g.lineCap = 'round';
  const stroke = (path, color, width, dash) => { g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash || []); g.stroke(path); g.setLineDash([]); };
  g.fillStyle = '#17323a'; g.fill(P.green); g.fillStyle = '#1d1b40'; g.fill(P.parking);
  stroke(P.service, '#3a3770', 4); stroke(P.street, '#0d0b20', 9.5); stroke(P.major, '#0d0b20', 13);
  stroke(P.street, '#6d69a6', 7); stroke(P.major, '#9793c8', 10);
  stroke(P.rail, '#c9c5f0', 1.6, [5, 4]);
  stroke(P.walk, '#3f3b78', 1.1, [2.2, 1.8]); stroke(P.steps, '#7d79b8', 2.2, [0.5, 0.8]);
  g.fillStyle = '#2a2750'; g.fill(P.block); stroke(P.block, '#413e7a', 0.6);
  g.shadowColor = '#ff3d9a'; g.shadowBlur = 22; g.fillStyle = '#3a2f6e'; g.fill(P.ttc); g.shadowBlur = 0;
  stroke(P.ttc, '#ff3d9a', Math.max(0.9, 2.2 / cam.z));

  // ---- indoors: fades in as you zoom into the building ----
  const inside = Math.min(1, Math.max(0, (cam.z - 4.5) / 2)), floor = shownFloor(), F = FP[floor];
  if (inside > 0 && F) {
    g.globalAlpha = inside;
    g.fillStyle = '#5b56a6'; g.fill(F.slab);     // its edge is where the photo was cropped, not a wall: no outline
    g.fillStyle = '#211e49'; g.fill(F.rooms); stroke(F.rooms, '#8a86c8', 0.16);
    g.fillStyle = '#1b6f78'; g.fill(F.stairs); stroke(F.stairs, '#2ce5d0', 0.2, [0.3, 0.3]);
    g.fillStyle = '#8a4320'; g.fill(F.cafe); stroke(F.cafe, '#ff9a3d', 0.2);
    g.shadowColor = '#ff3d9a'; g.shadowBlur = 16; g.fillStyle = '#6b1f58'; g.fill(F.dest); g.shadowBlur = 0; stroke(F.dest, '#ff3d9a', 0.25);
    g.globalAlpha = 1;
  }

  // ---- the route: pink ahead, teal behind; legs on the other floor are faint ----
  const me = along(stepNow());
  const leg = (p, q, fl, color, width) => { g.globalAlpha = inside > 0 && fl !== floor ? 1 - 0.75 * inside : 1;
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.strokeStyle = color; g.lineWidth = width / cam.z; g.stroke(); g.globalAlpha = 1; };
  for (let i = 0; i < R.length - 1; i++) {
    const p = R[i], q = R[i + 1], fl = p.floor === q.floor ? p.floor : floor;
    const done = i < me.i ? 1 : i > me.i ? 0 : me.t, mid = {x: p.x + (q.x - p.x) * done, y: p.y + (q.y - p.y) * done};
    if (done < 1) { leg(mid, q, fl, 'rgba(255,61,154,.35)', 11); leg(mid, q, fl, '#ff3d9a', 5); }
    if (done > 0) { leg(p, mid, fl, 'rgba(44,229,208,.3)', 10); leg(p, mid, fl, '#2ce5d0', 4); }
  }

  // ---- screen-space layer: labels and blips stay upright ----
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scr = p => { const dx = (p[0] - cam.x) * cam.z, dy = -(p[1] - cam.y) * cam.z;
    return [cam.px + dx * Math.cos(a) - dy * Math.sin(a), cam.py + dx * Math.sin(a) + dy * Math.cos(a)]; };
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const text = (s, q, font, color) => { g.font = font; g.lineWidth = 3; g.strokeStyle = 'rgba(13,11,32,.85)'; g.strokeText(s, q[0], q[1]); g.fillStyle = color; g.fillText(s, q[0], q[1]); };
  const DF = getComputedStyle(document.body).getPropertyValue('--display');
  if (cam.z > 1.6 && inside < 1) M.streets.forEach(l => text(l.n, scr([l.x, l.y]), `italic 700 11px ${DF}`, '#c9c5f0'));
  if (inside < 0.5) M.labels.forEach(l => { if (l.ttc ? l.n.length > 9 || cam.z > 3 : l.w * cam.z > l.n.length * 6.5)
    text(l.n, scr([l.x, l.y]), `italic 800 ${l.ttc ? 13 : 10.5}px ${DF}`, l.ttc ? '#ffd0e6' : '#8f8bc0'); });
  if (inside >= 0.5 && IN) IN.floors[floor].labels.forEach(l => {     // room numbers only once there is room for them
    const named = /[a-z]{3}/i.test(l.n); if (!named && cam.z < 11) return;
    const words = l.n.toUpperCase().split(' '), num = /^\d/.test(words[words.length - 1]) && words.length > 1 ? words.pop() : null;
    const q = scr([l.x, l.y]), size = named ? 10.5 : 9.5;
    text(words.join(' '), [q[0], q[1] - (num ? 6 : 0)], `italic 800 ${size}px ${DF}`, named ? '#ecd9ff' : '#a9a5dd');
    if (num) text(num, [q[0], q[1] + 6], `italic 700 9.5px ${DF}`, '#a9a5dd'); });
  const blip = (q, r, color) => { g.beginPath(); g.arc(q[0], q[1], r, 0, 7); g.fillStyle = color; g.fill(); g.lineWidth = 2.5; g.strokeStyle = '#14122b'; g.stroke(); };
  if (R.length) {
    const end = R[R.length - 1], q = scr([end.x, end.y]), pulse = still ? 0 : (now % 1400) / 1400;
    g.globalAlpha = inside > 0 && end.floor !== floor ? 0.3 : 1;
    g.beginPath(); g.arc(q[0], q[1], 9 + 16 * pulse, 0, 7); g.strokeStyle = `rgba(255,61,154,${1 - pulse})`; g.lineWidth = 2; g.stroke(); blip(q, 8, '#ff3d9a');
    g.globalAlpha = inside > 0 && R[0].floor !== floor ? 0.3 : 1; blip(scr([R[0].x, R[0].y]), 5, '#a29dcc');
  }
  g.globalAlpha = inside > 0 && me.floor !== floor ? 0.35 : 1;
  const here = scr([me.x, me.y]);
  g.save(); g.translate(here[0], here[1]); g.rotate((me.b - cam.b) * RAD);
  g.beginPath(); g.moveTo(0, -15); g.lineTo(11, 12); g.lineTo(0, 6); g.lineTo(-11, 12); g.closePath();
  g.shadowColor = '#2ce5d0'; g.shadowBlur = 14; g.fillStyle = '#fff'; g.fill(); g.shadowBlur = 0;
  g.lineWidth = 2; g.strokeStyle = '#14122b'; g.stroke(); g.restore(); g.globalAlpha = 1;
  $('north').firstElementChild.style.transform = `rotate(${-cam.b}deg)`;
}
function toggleView() { view = view === 'follow' ? 'map' : 'follow'; recentre(); if (S) render(S); }

// ---------------- zoom and pan ----------------
// Pinch, scroll or the + and - buttons zoom; zooming into the building brings up the floor plan.
// One finger drags the whole-map view. The follow view stays centred on you, so it zooms but does not pan.
const zoom = {follow: 1, map: 1}, pan = {x: 0, y: 0}, touches = new Map();
const viewKey = () => view === 'follow' && S && S.mode !== 'idle' ? 'follow' : 'map';
function zoomBy(f) { const k = viewKey(); zoom[k] = Math.min(k === 'map' ? 14 : 5, Math.max(0.2, zoom[k] * f)); }
function recentre() { zoom[viewKey()] = 1; pan.x = pan.y = 0; }
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
const map = $('map');
map.addEventListener('pointerdown', e => { touches.set(e.pointerId, [e.clientX, e.clientY]); map.setPointerCapture(e.pointerId); });
map.addEventListener('pointermove', e => {
  const was = touches.get(e.pointerId); if (!was) return;
  const before = touches.size === 2 ? spread() : 0;
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (touches.size === 2) { if (before > 0) zoomBy(spread() / before); return; }
  if (viewKey() === 'map') { pan.x -= (e.clientX - was[0]) / cam.z; pan.y += (e.clientY - was[1]) / cam.z; }
});
const lift = e => touches.delete(e.pointerId);
map.addEventListener('pointerup', lift); map.addEventListener('pointercancel', lift);
map.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY / 300)); }, {passive: false});

// ---------------- radio ----------------
// Plays the songs in web/music/ on the board in shuffled order: every song once, then a fresh shuffle.
const audio = new Audio(); let songs = [], queue = [], current = null;
const title = f => f.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');
function nextSong() {
  if (!songs.length) return;
  if (!queue.length) {
    queue = songs.slice();
    for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    if (queue.length > 1 && queue[queue.length - 1] === current) queue.unshift(queue.pop());   // no song twice in a row
  }
  current = queue.pop();
  audio.src = '/music/' + encodeURIComponent(current);
  $('song').textContent = title(current);
  audio.play().catch(() => {});
}
function playPause() { if (!current) nextSong(); else if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
audio.addEventListener('ended', nextSong);
audio.addEventListener('error', () => { if (current) { $('song').textContent = "Can't play " + title(current); } });
for (const ev of ['play', 'pause']) audio.addEventListener(ev, () => { $('play').textContent = audio.paused ? '▶' : '❚❚'; $('radio').classList.toggle('on', !audio.paused); });
api('/api/music').then(list => { songs = list; $('radio').classList.toggle('hidden', !songs.length);
  $('song').textContent = `Radio · ${songs.length} song${songs.length === 1 ? '' : 's'}`; }).catch(() => {});

async function poll() {
  if (!busy) {
    busy = true;
    try { render(await api('/api/state')); }
    catch (e) { $('objective').className = 'lost'; $('primary').textContent = 'Lost the board'; $('secondary').textContent = 'Check this phone is on the same hotspot as the board'; }
    busy = false;
  }
  setTimeout(poll, 400);
}
if (M) { build(); requestAnimationFrame(frame); }
poll();
